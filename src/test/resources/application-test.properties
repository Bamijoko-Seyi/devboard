spring.application.name=devboard

# Database — default to localhost for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT — override in production
app.jwt.secret=${JWT_SECRET:dev-secret-must-be-at-least-32-characters-long-ok}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}